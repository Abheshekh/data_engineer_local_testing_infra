services:
  pyspark-notebook:
    build: .
    container_name: pyspark-notebook-container-${CONTAINER_TIMESTAMP:-default}
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-2}
    ports:
      - "10000:8888"
      - "4040:4040"
      - "4041:4041"
    volumes:
      - pyspark-notebook-volume:/home/jovyan/work
      - delta-volume:/home/jovyan/delta
      - pyspark-events-volume:/home/jovyan/pyspark-events
    networks:
      - app-network

  localstack:
    profiles: [full-stack]
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
      - DATA_DIR=/var/lib/localstack
      - SERVICES=s3,ssm,lambda
      - LAMBDA_EXECUTOR=docker
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - s3-volume:/var/lib/localstack
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb:
    profiles: [full-stack]
    image: mongo:7.0
    container_name: mongodb-${CONTAINER_TIMESTAMP:-default}
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-volume:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pyspark-notebook-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NOTEBOOK_WORK_PATH}
  pyspark-events-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_BASE_PATH}/pyspark
  s3-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_BASE_PATH}/s3
  delta-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_BASE_PATH}/delta
  mongodb-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_BASE_PATH}/mongodb

networks:
  app-network:
    driver: bridge
